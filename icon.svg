  <title>dsh hello — 八卦双鲸</title>
  <desc>两只圆头鲸以点对称首尾环抱；额吻是一段与外廓半径相切的圆弧，额线一气到底无折点；逗号形眼白嵌对色圆瞳；嘴取自品牌源文件的腹部轮廓（60 点）；背线与腹线一体收束为双侧收腰尾柄，再舒展为饱满的柳叶双叉尾。</desc>
